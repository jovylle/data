# Prevents Supabase free-tier project from pausing after ~7 days of inactivity.
# Runs every 3 days; optional: add SUPABASE_ANON_KEY repo secret if ping returns 401.
name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */3 * *"  # Every 3 days at midnight UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://lnzlbxgocbyleqazkepk.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/?select=1")
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/?select=1")
          fi
          echo "Supabase ping completed (HTTP $code)"
