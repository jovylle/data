# Prevents Supabase free-tier project from pausing after ~7 days of inactivity.
# A real GET against a table runs a SQL query in Postgres — no INSERT/UPDATE needed.
# Runs every 3 days. GitHub secrets: SUPABASE_SECRET_KEY (typical) or SUPABASE_ANON_KEY (optional alt).
name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */3 * *" # Every 3 days at midnight UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (REST read)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          DEFAULT_URL="https://lnzlbxgocbyleqazkepk.supabase.co"
          BASE_URL="${SUPABASE_URL:-$DEFAULT_URL}"
          BASE_URL="${BASE_URL%/}"

          KEY="${SUPABASE_SECRET_KEY:-${SUPABASE_ANON_KEY:-}}"
          if [ -z "$KEY" ]; then
            echo "::error::Set GitHub secret SUPABASE_SECRET_KEY or SUPABASE_ANON_KEY."
            exit 1
          fi

          # Real resource path; empty table still returns 200 with [].
          path="/rest/v1/portfolio_projects?select=project_key&limit=1"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "${BASE_URL}${path}")

          echo "Supabase ping: GET ${path} → HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200; got ${code}. Check key, RLS, and table name."
            exit 1
          fi
